name: Keep Render Server Alive

on:
  schedule:
    # Run every 10 minutes to keep the Render free tier server from spinning down
    # Render spins down free instances after 15 minutes of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server health endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_URL }}"
          
          if [ -z "$RENDER_URL" ]; then
            echo "::error::RENDER_URL secret is not set in GitHub repository settings."
            exit 1
          fi
          
          # Normalize URL
          RENDER_URL=$(echo $RENDER_URL | sed 's/\/$//')
          if [[ ! $RENDER_URL =~ ^http ]]; then
            RENDER_URL="https://$RENDER_URL"
          fi
          
          echo "Pinging $RENDER_URL/ping..."
          start_time=$(date +%s%N)
          response=$(curl -s -w "\n%{http_code}" "$RENDER_URL/ping" || echo -e "\n000")
          end_time=$(date +%s%N)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          duration=$(( (end_time - start_time) / 1000000 ))
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          echo "Duration: ${duration}ms"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✓ Server is alive"
            exit 0
          else
            echo "✗ Server health check failed with code $http_code"
            exit 1
          fi
